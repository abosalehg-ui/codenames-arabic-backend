name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ملاحظة: بلا fetch-depth كامل عمداً — تاريخ هذا المستودع يحمل سراً قديماً
      # مسرَّباً (.env في commits ما قبل 9b2ee99، موثّق في SECURITY.md) لم يُمحَ من
      # التاريخ بعد. فحص السجل الكامل هنا يُبقي CI أحمر دائماً بلا فائدة إضافية؛
      # هذا الفحص يغطي كل ارتكاب جديد من الآن فصاعداً، وهو ما يمنع تكرار الحادثة.
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks) — الالتزامات الجديدة فقط
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Integration test (full game over socket.io)
        run: npm run test:integration

      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
